name: probe
on: workflow_dispatch
jobs:
  devlink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Can a forge publish its ports under /dev on Linux?
        run: |
          echo "PROBE bare symlink in /dev:"
          sudo ln -s /dev/null /dev/ttyforge-probe && ls -l /dev/ttyforge-probe && sudo rm -f /dev/ttyforge-probe
          echo "PROBE starting a forge with --link /dev/…"
          sudo ./target/debug/ttyforge pair --link /dev/ttyforge0 --link /dev/ttyforge1 --json \
            > /tmp/ready.json 2>/tmp/err.log &
          sleep 3
          echo "PROBE readiness: $(cat /tmp/ready.json)"
          echo "PROBE stderr:    $(cat /tmp/err.log)"
          sudo ls -l /dev/ttyforge0 /dev/ttyforge1 2>&1 | sed 's/^/PROBE node: /'
          sudo python3 - <<'PY'
          import os, select
          a = os.open('/dev/ttyforge0', os.O_RDWR | os.O_NOCTTY)
          b = os.open('/dev/ttyforge1', os.O_RDWR | os.O_NOCTTY)
          os.write(a, b'hello-over-dev')
          r, _, _ = select.select([b], [], [], 3.0)
          print("PROBE transfer:", os.read(b, 64) if r else b"(nothing arrived)")
          PY
          sudo pkill -TERM -f 'ttyforge pair' || true
          sleep 1
          ls -l /dev/ttyforge0 2>&1 | sed 's/^/PROBE after teardown: /'
